<style>
:root{
  --page:#f3f4f7;
  --surface:#ffffff;
  --surface-2:#f8f8fb;
  --surface-3:#f1eff6;
  --ink:#17131f;
  --muted:#777483;
  --muted-2:#9a97a5;
  --border:#e6e4ea;
  --border-strong:#d8d5df;
  --primary:#432160;
  --primary-2:#5b2d82;
  --primary-soft:#eee7f5;
  --primary-faint:#f7f3fa;
  --accent:#00a86b;
  --accent-soft:#e9f8f2;
  --danger:#d92d20;
  --danger-soft:#fff0ef;
  --warning:#d97706;
  --shadow:0 8px 28px rgba(28,19,40,.06);
  --shadow-lg:0 22px 60px rgba(28,19,40,.14);
  --radius:12px;
  --ff-display:'Manrope',sans-serif;
  --ff-body:'Inter',sans-serif;

  /* legacy aliases retained for existing JS/templates */
  --pitch-dark:var(--page);
  --pitch:var(--surface);
  --pitch-light:var(--surface-3);
  --line:var(--border);
  --gold:var(--primary-2);
  --gold-soft:var(--primary-2);
  --chalk:var(--ink);
  --chalk-dim:var(--muted);
  --card:var(--surface);
  --card-hi:var(--surface);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
html{background:var(--page)}
body{
  font-family:var(--ff-body);
  color:var(--ink);
  background:var(--page);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select{font:inherit}
button{color:inherit}
::selection{background:#dfd0ee;color:var(--primary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9c5cf;border:3px solid transparent;background-clip:padding-box;border-radius:999px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh;background:var(--page)}
.sidebar{
  width:264px;flex:0 0 264px;height:100vh;position:sticky;top:0;z-index:50;
  display:flex;flex-direction:column;padding:0;
  background:linear-gradient(180deg,#251333 0%,#33164a 100%);
  color:#fff;border-right:1px solid rgba(255,255,255,.06);
  box-shadow:10px 0 35px rgba(35,18,50,.04);
}
.sidebar::after{
  content:"";position:absolute;inset:auto -60px 64px auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(151,91,190,.18),transparent 68%);pointer-events:none
}
.brand{height:86px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-badge{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:#fff;color:var(--primary);font-family:var(--ff-display);font-weight:800;font-size:18px;letter-spacing:-1px;
  box-shadow:none;position:relative
}
.brand-badge::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#9b65c2;right:-2px;bottom:-2px;border:3px solid #2b153d}
.brand-name{font-family:var(--ff-display);font-size:20px;font-weight:800;letter-spacing:.7px;color:#fff;line-height:1}
.brand-sub{font-size:9px;letter-spacing:1.6px;color:rgba(255,255,255,.52);text-transform:uppercase;margin-top:5px;font-weight:600}
.sidebar > div:nth-of-type(2){padding:24px 16px 10px;display:flex;flex-direction:column;min-height:0;flex:1}
.sidebar-section-title{font-size:10px;font-weight:700;letter-spacing:1.25px;text-transform:uppercase;color:rgba(255,255,255,.43);padding:0 10px;margin:0 0 10px}
.division-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.division-item{
  display:flex;align-items:center;gap:10px;padding:11px 11px;border-radius:8px;cursor:pointer;
  color:rgba(255,255,255,.72);border:1px solid transparent;transition:background .18s ease,color .18s ease,border-color .18s ease;
  position:relative;font-size:13px
}
.division-item:hover{background:rgba(255,255,255,.075);color:#fff;transform:none}
.division-item.active{background:#fff;color:var(--primary);border-color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.division-item.active::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;background:#b58bd2;border-radius:0 3px 3px 0}
.division-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.24);flex:0 0 7px}
.division-item.active .division-dot{background:var(--primary-2);box-shadow:none}
.division-item span.dname{flex:1;font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.division-item .dcount{font-size:10px;font-weight:700;color:inherit;opacity:.62;background:currentColor;border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;position:relative}
.division-item .dcount::after{content:attr(data-count);position:absolute;color:#fff}
.division-item.active .dcount{background:var(--primary-soft);color:var(--primary)}
.division-item .del-x{opacity:0;font-size:12px;color:#ffb4ad;padding:3px 5px;border-radius:5px;transition:opacity .15s ease;background:transparent}
.division-item:hover .del-x{opacity:.95}.division-item .del-x:hover{background:rgba(255,255,255,.08)}
.sidebar > .btn-block{margin:0 16px 18px;width:calc(100% - 32px)}

/* ---------- top utility header ---------- */
.main{flex:1;min-width:0;padding:0;background:var(--page)}
.global-header{
  height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 34px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40
}
.global-left{display:flex;align-items:center;gap:16px;min-width:0}
.global-breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.global-breadcrumb strong{color:var(--ink);font-weight:700}
.crumb-sep{color:#bbb7c2}
.global-tools{display:flex;align-items:center;gap:10px}
.search-shell{
  width:230px;height:38px;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;
  display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--muted);font-size:12px
}
.search-shell svg{width:15px;height:15px;stroke:currentColor}
.admin-pill{height:40px;display:flex;align-items:center;gap:9px;padding:0 10px 0 5px;border:1px solid var(--border);border-radius:9px;background:#fff}
.admin-avatar{width:30px;height:30px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.4px}
.admin-copy{line-height:1.05}.admin-copy strong{display:block;font-size:11px;font-weight:700}.admin-copy span{font-size:9px;color:var(--muted)}
.main-inner{padding:34px clamp(24px,3vw,46px) 64px}.main-inner>#content{max-width:1460px;margin:0 auto}

/* ---------- buttons ---------- */
.btn{
  min-height:40px;padding:0 14px;border:1px solid transparent;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--ff-body);font-size:12px;font-weight:700;letter-spacing:0;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease,color .16s ease;white-space:nowrap
}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-gold{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 5px 14px rgba(67,33,96,.14)}
.btn-gold:hover{background:#351a4c;border-color:#351a4c;box-shadow:0 8px 18px rgba(67,33,96,.18)}
.sidebar .btn-gold{background:#fff;color:var(--primary);border-color:#fff;box-shadow:none}.sidebar .btn-gold:hover{background:#f5f0f8}
.btn-ghost{background:#fff;color:#3d3945;border-color:var(--border)}.btn-ghost:hover{border-color:#cfcbd5;background:#faf9fb}
.btn-danger{background:#fff;color:var(--danger);border-color:#f0c8c4}.btn-danger:hover{background:var(--danger-soft);border-color:#e9a9a3}
.btn-block{width:100%}.btn-sm{min-height:36px;padding:0 12px;font-size:11.5px;border-radius:7px}
.icon-svg{width:15px;height:15px;display:inline-block;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- competition page header ---------- */
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 0 22px;flex-wrap:wrap}
.page-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.45px;text-transform:uppercase;color:var(--primary-2);margin-bottom:9px}
.division-title{font-family:var(--ff-display);font-size:34px;font-weight:800;letter-spacing:-1.15px;line-height:1.08;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.division-title .accent{color:var(--primary)}
.division-meta{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;margin-top:9px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.season-chip{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--primary);background:var(--primary-soft);border:1px solid #dfd2e9;padding:5px 8px;border-radius:6px;letter-spacing:.25px;margin:0;vertical-align:middle}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:26px;background:transparent;padding:0;border-radius:0;width:100%;margin:0 0 26px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab-btn{position:relative;padding:0 0 13px;border:none;background:transparent;color:var(--muted);font-family:var(--ff-body);font-weight:650;font-size:12px;cursor:pointer;letter-spacing:0;white-space:nowrap;transition:color .16s ease}
.tab-btn.active{background:transparent;color:var(--primary);box-shadow:none}.tab-btn.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.tab-btn:not(.active):hover{color:var(--ink)}
.tab-panel{display:none;animation:fadein .22s ease}.tab-panel.active{display:block}@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* ---------- cards / tables ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px rgba(20,14,26,.02);overflow:hidden}
table.standings{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.standings thead th{text-align:left;padding:12px 14px;font-size:9.5px;letter-spacing:.85px;text-transform:uppercase;color:#8d8995;background:#faf9fb;border-bottom:1px solid var(--border);font-weight:800}
table.standings thead th.num{text-align:center}table.standings tbody td{padding:12px 14px;border-bottom:1px solid #eeecf0;vertical-align:middle}table.standings tbody td.num{text-align:center;color:#625e69;font-variant-numeric:tabular-nums;font-weight:500}table.standings tbody tr{transition:background .16s ease}table.standings tbody tr:hover{background:#faf8fc}table.standings tbody tr:last-child td{border-bottom:none}
.pos-cell{display:flex;align-items:center;gap:8px;font-weight:800}.pos-badge{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;background:#f1eff3;color:#5f5a67;font-weight:800}
tr.zone-1,tr.zone-2{background:transparent;position:relative}tr.zone-1::after,tr.zone-2::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary-2)}tr.zone-1 .pos-badge,tr.zone-2 .pos-badge{background:var(--primary-soft);color:var(--primary);border:none;box-shadow:none}
tr.zone-relegate{background:transparent;position:relative}tr.zone-relegate::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--danger)}tr.zone-relegate .pos-badge{background:var(--danger-soft);color:var(--danger);border:none}
.team-cell{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
.crest{width:30px;height:30px;border-radius:7px;object-fit:contain;background:#fff;border:1px solid var(--border);flex:0 0 30px;padding:2px}
.crest-fallback{width:30px;height:30px;border-radius:7px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--primary);border:1px solid #e0d6e8;flex:0 0 30px}
td.pts{font-weight:800!important;color:var(--ink)!important;font-size:13px}.gd-pos{color:#16845c!important}.gd-neg{color:#c94338!important}
.legend{display:flex;gap:20px;padding:12px 16px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);background:#faf9fb;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:3px;height:14px;border-radius:4px;display:inline-block}
.form-strip{display:flex;justify-content:center;gap:4px}.form-dot{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800}.form-w{background:#e8f7f1;color:#087a52}.form-d{background:#f0eff2;color:#66616c}.form-l{background:#fff0ef;color:#c43b30}.form-empty{background:#f5f4f6;color:#aaa6af}

/* ---------- section headings ---------- */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:14px;flex-wrap:wrap}.section-header h3{font-family:var(--ff-display);font-size:18px;letter-spacing:-.3px;font-weight:800;margin:0;color:var(--ink)}
.section-kicker{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:750;margin-bottom:5px}

/* ---------- fixtures ---------- */
.round-group{margin-bottom:24px}.round-label{font-size:10px;letter-spacing:.85px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-left:2px;font-weight:800}
.match-row{display:grid;grid-template-columns:minmax(170px,1fr) 110px minmax(170px,1fr) 96px 74px;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:7px;transition:border-color .17s ease,box-shadow .17s ease,transform .17s ease}.match-row:hover{border-color:#d7cce0;box-shadow:0 6px 18px rgba(50,29,67,.055);transform:translateY(-1px)}
.match-team{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12.5px;color:var(--ink)}.match-team.home{justify-content:flex-end;text-align:right}.match-team.away{justify-content:flex-start}.score-box{display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--ff-display);font-size:20px;font-weight:800;color:var(--ink);background:#f4f1f7;border:1px solid #e4dce9;border-radius:7px;padding:7px 9px;letter-spacing:0;min-height:38px}.score-box .vs{font-size:10px;color:var(--muted);font-family:var(--ff-body);font-weight:700}.score-box.unplayed{color:var(--primary);font-size:10.5px;font-family:var(--ff-body);font-weight:800;background:var(--primary-faint)}.match-date{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600}.match-actions{display:flex;gap:5px;justify-content:flex-end}.icon-btn{width:31px;height:31px;border-radius:7px;border:1px solid var(--border);background:#fff;color:#716c79;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s ease}.icon-btn:hover{background:var(--primary-faint);color:var(--primary);border-color:#d8cbe1}.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#efc1bd}.badge-live{font-size:9px;background:var(--danger-soft);color:var(--danger);padding:3px 6px;border-radius:4px;letter-spacing:.7px;font-weight:800;border:1px solid #efc1bd}

/* ---------- teams ---------- */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.team-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:18px;display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:left;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;position:relative;min-height:176px}.team-card:hover{transform:translateY(-2px);border-color:#d6c8df;box-shadow:0 10px 24px rgba(40,24,52,.07)}.team-card>.clickable{display:flex;align-items:center;gap:12px;text-decoration:none!important}.team-card .crest-lg{width:58px;height:58px;border-radius:11px;object-fit:contain;background:#fff;border:1px solid var(--border);padding:4px}.team-card .crest-lg-fallback{width:58px;height:58px;border-radius:11px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-family:var(--ff-display);font-size:16px;color:var(--primary);font-weight:800;border:1px solid #ded2e7}.team-card .tname{font-weight:800;font-size:13.5px;color:var(--ink);line-height:1.25}.team-card .tstats{font-size:10.5px;color:var(--muted);padding-top:12px;border-top:1px solid #eeecf0}.team-card .tools{position:absolute;top:11px;right:11px;display:flex;gap:5px;opacity:0;transition:opacity .18s ease}.team-card:hover .tools{opacity:1}.club-card-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}.club-card-stat{background:#faf9fb;border-radius:7px;padding:8px}.club-card-stat strong{display:block;font-size:12px;color:var(--ink)}.club-card-stat span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted);margin-top:2px}.club-card-link{font-size:10px;color:var(--primary);font-weight:800;margin-left:auto}
.add-team-card{border:1px dashed #cfcbd4;background:rgba(255,255,255,.45);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:176px;color:var(--muted);cursor:pointer;transition:all .18s ease;font-size:11px;font-weight:700}.add-team-card:hover{border-color:#a78eba;color:var(--primary);background:#fbf8fd}.add-team-card .plus{width:34px;height:34px;border-radius:8px;background:var(--primary-soft);display:grid;place-items:center;font-size:20px;font-family:var(--ff-body);color:var(--primary)}

/* ---------- history ---------- */

/* ================= RESPONSIVE ================= */

/* touch & mobile hygiene, applies everywhere */
button,.clickable,.icon-btn,.tab-btn,.division-item,.team-card,.match-row,.player-card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.modal{max-height:90vh;overflow-y:auto}

/* sidebar drawer backdrop (mobile) */
.sidebar-backdrop{position:fixed;inset:0;background:rgba(20,12,28,.45);z-index:85;opacity:0;pointer-events:none;transition:opacity .22s ease}
.sidebar-backdrop.show{opacity:1;pointer-events:auto}
body.sidebar-open{overflow:hidden}

/* safe-area padding for notched phones */
.global-header{padding-left:max(34px,env(safe-area-inset-left));padding-right:max(34px,env(safe-area-inset-right))}
.sidebar{padding-left:env(safe-area-inset-left)}
.toast-wrap{padding-bottom:env(safe-area-inset-bottom)}

/* ---- large desktop / laptop (≤1280px): tighten side padding ---- */
@media(max-width:1280px){
  .main-inner{padding:30px clamp(18px,2.6vw,38px) 56px}
}

/* ---- small laptop / large tablet landscape (≤1080px) ---- */
@media(max-width:1080px){
  .search-shell{display:none}
  .club-grid{grid-template-columns:1fr}
  .teams-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

/* ---- tablet / narrow laptop (≤940px): sidebar becomes an overlay drawer ---- */
@media(max-width:940px){
  .sidebar{position:fixed;top:0;left:-290px;width:280px;flex:0 0 280px;z-index:90;transition:left .23s ease;box-shadow:18px 0 42px rgba(27,15,36,.22)}
  .sidebar.open{left:0}
  .app{display:block}
  .main{width:100%}
  .global-header{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));height:64px}
  .menu-toggle{display:flex!important}
  .global-breadcrumb{display:none}
  .main-inner{padding:24px 16px 48px}
  .division-title{font-size:28px}
  .club-hero{padding:22px}
}

/* ---- large phone / small tablet portrait (≤880px) ---- */
@media(max-width:880px){
  .match-row{grid-template-columns:1fr;gap:8px;text-align:center}
  .match-team.home,.match-team.away{justify-content:center;text-align:center}
  .match-actions{justify-content:center}
  .match-date{order:-1}
  .score-box{max-width:150px;margin:auto}
  .field-row,.settings-grid{flex-direction:column;gap:0}
  .admin-copy{display:none}
  .club-hero-actions{width:100%}
  .club-hero-actions .btn{flex:1}
}

/* ---- phones (≤620px) ---- */
@media(max-width:620px){
  .topbar{align-items:flex-start;flex-direction:column}
  .topbar-actions{width:100%}
  .topbar-actions .btn{flex:1}
  .tabs{gap:20px}
  .teams-grid{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:repeat(3,1fr)}
  .club-hero{padding:20px}
  .club-hero .crest-xl,.club-hero .crest-xl-fallback{width:76px;height:76px}
  .history-left{gap:8px}
  .history-date{display:none}
  .history-teams{font-size:10.5px}
  .global-tools{margin-left:auto}
  .squad-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  /* iOS Safari zooms the page on focus if inputs are smaller than 16px — override */
  .field input[type=text],.field input[type=date],.field input[type=number],.field select{font-size:16px}
  .score-entry input{font-size:18px}
}

/* ---- small phones (≤480px) ---- */
@media(max-width:480px){
  .brand{padding:0 16px;height:74px}
  .brand-name{font-size:17px}
  .modal{padding:18px;max-width:none;width:100%;border-radius:12px}
  .modal h3{font-size:17px;margin-bottom:16px}
  .division-title{font-size:23px}
  .page-eyebrow{margin-bottom:6px}
  .stat-strip{grid-template-columns:repeat(2,1fr)}
  .stat-box{padding:11px}
  .club-hero-info h1{font-size:23px}
  .club-meta-row{gap:10px;font-size:9.5px}
  .section-header h3{font-size:16px}
  .btn{font-size:11.5px;padding:0 12px}
  .toast-wrap{left:12px;right:12px;bottom:16px}
  .toast{width:100%}
  .legend{gap:12px;font-size:9.5px}
  .club-recent-item{font-size:9.5px;padding:10px 11px}
}

/* ---- very small phones (≤360px) ---- */
@media(max-width:360px){
  .main-inner{padding:18px 12px 40px}
  .global-header{padding-left:14px;padding-right:14px}
  .division-title{font-size:20px}
  .stat-strip{grid-template-columns:repeat(2,1fr)}
  .squad-grid{grid-template-columns:1fr 1fr}
  .modal{padding:16px}
  .score-entry{gap:8px}
  .score-entry input{width:52px;height:48px;font-size:16px}
}

/* ---- landscape phones: keep modals scrollable within a short viewport ---- */
@media (max-height:480px) and (orientation:landscape){
  .modal{max-height:85vh}
  .brand{height:64px}
  .sidebar-section-title{margin-top:4px}
}

/* ---- larger touch targets on touch devices, any screen size ---- */
@media (pointer:coarse){
  .icon-btn{width:36px;height:36px}
  .tab-btn{padding-bottom:15px}
  .division-item{padding:13px 11px}
  .btn-sm{min-height:38px}
}

/* ---- ultra-wide monitors: keep content readable, don't over-stretch ---- */
@media(min-width:1800px){
  .main-inner>#content{max-width:1560px}
}
</style>

<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-badge">A</div>
      <div>
        <div class="brand-name">ARENA</div>
        <div class="brand-sub">Competition Management</div>
      </div>
    </div>

    <div>
      <div class="sidebar-section-title"><span>Соревнования</span></div>
      <ul class="division-list" id="divisionList"></ul>
    </div>

    <button class="btn btn-gold btn-block" onclick="openDivisionModal()">+ Новый дивизион</button>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <main class="main">
    <header class="global-header">
      <div class="global-left">
        <button class="menu-toggle" aria-label="Открыть меню" onclick="toggleSidebar()">☰</button>

      </div>
      <div class="global-tools">
        <div class="search-shell" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
          <span>Поиск по турниру</span>

        <div class="admin-pill">
          <div class="admin-avatar">AD</div>
          <div class="admin-copy"><strong>League Admin</strong><span>Administrator</span></div>
        </div>
      </div>
    </header>
    <div class="main-inner"><div id="content"></div></div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- Modal: division -->
<div class="overlay" id="overlay-division">
  <div class="modal">
    <h3>Новый дивизион</h3>
    <div class="field">
      <label>Название дивизиона</label>
      <input type="text" id="div-name" placeholder="Например: Премьер Лига">
    </div>
    <div class="field">
      <label>Текущий сезон</label>
      <input type="text" id="div-season" placeholder="2026/27" value="2026/27">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('overlay-division')">Отмена</button>
      <button class="btn btn-gold" onclick="submitDivision()">Создать</button>
    </div>
  </div>
</div>

<!-- Modal: team -->
<div class="overlay" id="overlay-team">
  <div class="modal" style="max-width:480px;max-height:88vh;overflow-y:auto;">
    <h3 id="team-modal-title">Новая команда</h3>
    <input type="hidden" id="team-edit-id">
    <div class="field">
      <label>Название команды</label>

        <label>Год основания</label>

    </div>

      <input type="text" id="team-stadium" placeholder="Пахтакор Маркази">

    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('overlay-team')">Отмена</button>
      <button class="btn btn-gold" onclick="submitTeam()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Modal: player -->
<div class="overlay" id="overlay-player">

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('overlay-player')">Отмена</button>
      <button class="btn btn-gold" onclick="submitPlayer()">Сохранить</button>

<!-- html2canvas: используется только для экспорта таблицы в JPEG-изображение -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ================= STATE (in-memory) ================= */
let state = {
  divisions: [],
  activeDivisionId: null,
  activeTab: 'standings',
  clubView: null // { divisionId, teamId }
};
let uid = () => Math.random().toString(36).slice(2, 10);

function newTeam(name, kitColor){
  return {
    id: uid(), name, logo: null,
    city: '', stadium: '', coach: '', founded: '', kitColor: kitColor || '#5b2d82',
    players: [], trophies: { champion: 0 }
  };
}

/* ================= SEED DATA ================= */
function seed(){
  const teamNames = [
    ['Стальные Волки','#d4af37'], ['Речные Соколы','#3b82f6'], ['Городские Тигры','#e0663a'],
    ['Северный Альянс','#8b5cf6'], ['Огненные Быки','#c0392b'], ['Морские Драконы','#0ea5a4']
  ];
  const div = {
    id: uid(), name: 'Премьер Лига', teams: [], matches: [],
    seasonLabel: '2026/27', promote: 2, relegate: 2, archive: []
  };
  teamNames.forEach(([n,c]) => div.teams.push(newTeam(n, c)));
  state.divisions.push(div);
  state.activeDivisionId = div.id;
}
/* seed() больше не вызывается сразу — сначала проверяем данные в Firebase, см. initApp() внизу файла */

/* ================= HELPERS ================= */
function getDivision(id){ return state.divisions.find(d => d.id === id); }
function activeDivision(){ return getDivision(state.activeDivisionId); }
function getTeam(div, id){ return div.teams.find(t => t.id === id); }
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span>✓</span> ' + msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}
function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function crestHtml(team, size){
  const cls = size === 'lg' ? 'crest-lg' : 'crest';
  const fcls = size === 'lg' ? 'crest-lg-fallback' : 'crest-fallback';
  if(team.logo) return `<img class="${cls}" src="${team.logo}">`;
  return `<div class="${fcls}">${initials(team.name)}</div>`;
}

/* ================= STANDINGS CALC ================= */
function computeStandings(div){
  const table = {};
  div.teams.forEach(t => table[t.id] = {
    team: t, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0
  });
  div.matches.forEach(m => {
    if(!m.played) return;
    const h = table[m.homeId], a = table[m.awayId];
    if(!h || !a) return;
    h.mp++; a.mp++;
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    if(m.homeScore > m.awayScore){ h.w++; a.l++; h.pts += 3; }
    else if(m.homeScore < m.awayScore){ a.w++; h.l++; a.pts += 3; }
    else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
  });
  const rows = Object.values(table);
  rows.forEach(r => r.gd = r.gf - r.ga);
  rows.sort((x,y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  return rows;
}

/* ================= RENDER: SIDEBAR ================= */
function renderSidebar(){
  const list = document.getElementById('divisionList');
  list.innerHTML = '';
  state.divisions.forEach(d => {
    const li = document.createElement('li');
    li.className = 'division-item' + (d.id === state.activeDivisionId ? ' active' : '');
    li.innerHTML = `
      <span class="division-dot"></span>
      <span class="dname">${escapeHtml(d.name)}</span>
      <span class="dcount" data-count="${d.teams.length}">${d.teams.length}</span>
      <span class="del-x" title="Удалить дивизион">${iconSvg('trash',12)}</span>
    `;
    li.querySelector('.dname').onclick = () => selectDivision(d.id);
    li.querySelector('.division-dot').onclick = () => selectDivision(d.id);
    li.querySelector('.dcount').onclick = () => selectDivision(d.id);
    li.querySelector('.del-x').onclick = (e) => { e.stopPropagation(); deleteDivision(d.id); };
    list.appendChild(li);
  });
}
function selectDivision(id){
  state.activeDivisionId = id;
  state.activeTab = 'standings';
  closeSidebar();
  renderAll();
}
function toggleSidebar(){
  const opening = !document.getElementById('sidebar').classList.contains('open');
  document.getElementById('sidebar').classList.toggle('open', opening);
  document.getElementById('sidebarBackdrop').classList.toggle('show', opening);
  document.body.classList.toggle('sidebar-open', opening);
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.body.classList.remove('sidebar-open');
}
function deleteDivision(id){
  const d = getDivision(id);
  if(!confirm(`Удалить дивизион «${d.name}» вместе со всеми командами и матчами?`)) return;
  state.divisions = state.divisions.filter(x => x.id !== id);
  if(state.activeDivisionId === id){
    state.activeDivisionId = state.divisions.length ? state.divisions[0].id : null;
  }
  renderAll();
  toast('Дивизион удалён');
}

/* ================= RENDER: MAIN CONTENT ================= */
function escapeHtml(s){ const d=document.createElement('div'); d.innerText = s; return d.innerHTML; }

function iconSvg(name, size=15){
  const icons = {
    settings:'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.03H5.3v-3h.14A1.7 1.7 0 0 0 7 9.94a1.7 1.7 0 0 0-.34-1.88L6.6 8l2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.69 4.7v-.08h3v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.78 8l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.08v3h-.08A1.7 1.7 0 0 0 19.4 15z"></path>',
    flag:'<path d="M5 21V4"></path><path d="M5 5h11l-1.8 3L16 11H5"></path>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>',
    shuffle:'<path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path>',
    edit:'<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>',
    trash:'<path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path>',
    download:'<path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>'
  };
  return `<svg class="icon-svg" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||''}</svg>`;
}

function teamForm(div, teamId){
  return div.matches
    .filter(m => m.played && (m.homeId===teamId || m.awayId===teamId))
    .slice()
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''))
    .slice(0,5)
    .map(m => {
      const isHome = m.homeId === teamId;
      const gf = isHome ? m.homeScore : m.awayScore;
      const ga = isHome ? m.awayScore : m.homeScore;
      return gf>ga ? 'W' : gf<ga ? 'L' : 'D';
    })
    .reverse();
}
function formHtml(div, teamId){
  const form = teamForm(div, teamId);
  const padded = Array(Math.max(0,5-form.length)).fill('-').concat(form);
  return `<div class="form-strip">${padded.map(x=>`<span class="form-dot ${x==='W'?'form-w':x==='D'?'form-d':x==='L'?'form-l':'form-empty'}">${x==='-'?'·':x}</span>`).join('')}</div>`;
}

function renderAllUI(){
  renderSidebar();
  const content = document.getElementById('content');
  const div = activeDivision();
  if(!div){
    content.innerHTML = `
      <div class="empty-state">
        <h2>Пока нет соревнований</h2>
        <div>Создайте первый дивизион и начните управлять командами, календарём и таблицей.</div>
        <button class="btn btn-gold" style="margin-top:8px" onclick="openDivisionModal()">+ Новый дивизион</button>
      </div>`;
    return;
  }

  if(state.clubView && state.clubView.divisionId === div.id){
    const team = getTeam(div, state.clubView.teamId);
    if(team){ renderClubPage(div, team); return; }
    state.clubView = null;
  }

  const played = div.matches.filter(m=>m.played).length;
  content.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-eyebrow">Competition workspace</div>
        <div class="division-title">${escapeHtml(div.name)} <span class="season-chip">Season ${escapeHtml(div.seasonLabel||'')}</span></div>
        <div class="division-meta"><span class="status-dot"></span><span>Активный сезон</span><span>·</span><span>${div.teams.length} команд</span><span>·</span><span>${played} сыграно из ${div.matches.length} матчей</span></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="openDivisionSettings()">${iconSvg('settings')} Настройки</button>
        <button class="btn btn-danger btn-sm" onclick="endSeason()">${iconSvg('flag')} Завершить сезон</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${state.activeTab==='standings'?'active':''}" onclick="setTab('standings')">Таблица</button>
      <button class="tab-btn ${state.activeTab==='fixtures'?'active':''}" onclick="setTab('fixtures')">Матчи</button>
      <button class="tab-btn ${state.activeTab==='teams'?'active':''}" onclick="setTab('teams')">Команды</button>
      <button class="tab-btn ${state.activeTab==='history'?'active':''}" onclick="setTab('history')">История</button>
      <button class="tab-btn ${state.activeTab==='archive'?'active':''}" onclick="setTab('archive')">Архив${div.archive.length?` · ${div.archive.length}`:''}</button>
    </div>

    <div id="panel-standings" class="tab-panel ${state.activeTab==='standings'?'active':''}"></div>
    <div id="panel-fixtures" class="tab-panel ${state.activeTab==='fixtures'?'active':''}"></div>
    <div id="panel-teams" class="tab-panel ${state.activeTab==='teams'?'active':''}"></div>
    <div id="panel-history" class="tab-panel ${state.activeTab==='history'?'active':''}"></div>
    <div id="panel-archive" class="tab-panel ${state.activeTab==='archive'?'active':''}"></div>
  `;

  renderStandingsPanel(div);
  renderFixturesPanel(div);
  renderTeamsPanel(div);
  renderHistoryPanel(div);
  renderArchivePanel(div);
}
/* Обёртка: каждый renderAll() теперь ещё и планирует сохранение состояния в Firebase */
function renderAll(){
  renderAllUI();
  scheduleSave();
}
function setTab(t){ state.activeTab = t; renderAll(); }

/* ---------- standings panel ---------- */
function renderStandingsPanel(div){
  const el = document.getElementById('panel-standings');
  const rows = computeStandings(div);
  if(!div.teams.length){
    el.innerHTML = `<div class="empty-state"><h2>Нет команд</h2><div>Добавьте клубы во вкладке «Команды», после этого таблица будет рассчитываться автоматически.</div></div>`;
    return;
  }
  const promoteN = div.promote || 0;
  const relegateN = div.relegate || 0;
  const canOverlap = promoteN + relegateN > rows.length;
  el.innerHTML = `
    <div class="section-header">
      <div><div class="section-kicker">League standings</div><h3>Турнирная таблица</h3></div>
      <button class="btn btn-ghost btn-sm" onclick="exportStandingsImage()" ${!div.teams.length?'disabled':''}>${iconSvg('download')} Скачать JPEG</button>
    </div>
    <div class="card" style="overflow-x:auto">
      <table class="standings" style="min-width:850px">
        <thead>
          <tr>
            <th>POS</th><th>КЛУБ</th>
            <th class="num">И</th><th class="num">В</th><th class="num">Н</th><th class="num">П</th>
            <th class="num">ЗМ</th><th class="num">ПМ</th><th class="num">РМ</th><th class="num">О</th><th class="num">ФОРМА</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r,i) => {
            const isPromote = !canOverlap && i < promoteN;
            const isRelegate = !canOverlap && i >= rows.length - relegateN;
            const zoneClass = isPromote ? (i===0?'zone-1':'zone-2') : (isRelegate ? 'zone-relegate' : '');
            return `
            <tr class="${zoneClass}">
              <td><div class="pos-cell"><div class="pos-badge">${i+1}</div></div></td>
              <td><div class="team-cell clickable" onclick="openClub('${r.team.id}')">${crestHtml(r.team,'sm')} ${escapeHtml(r.team.name)}</div></td>
              <td class="num">${r.mp}</td><td class="num">${r.w}</td><td class="num">${r.d}</td><td class="num">${r.l}</td>
              <td class="num">${r.gf}</td><td class="num">${r.ga}</td>
              <td class="num ${r.gd>0?'gd-pos':r.gd<0?'gd-neg':''}">${r.gd>0?'+':''}${r.gd}</td>
              <td class="num pts">${r.pts}</td><td class="num">${formHtml(div,r.team.id)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="legend">
        ${promoteN ? `<span><i style="background:var(--primary-2)"></i> Зона повышения (${promoteN})</span>` : ''}
        ${relegateN ? `<span><i style="background:var(--danger)"></i> Зона вылета (${relegateN})</span>` : ''}
        <span>И — игры · ЗМ/ПМ — мячи · РМ — разница · О — очки</span>
      </div>
    </div>`;
}

/* ---------- fixtures panel ---------- */
function renderFixturesPanel(div){
  const el = document.getElementById('panel-fixtures');
  el.innerHTML = `
    <div class="section-header">
      <div><div class="section-kicker">Fixture centre</div><h3>Расписание матчей</h3></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="generateSchedule()" ${div.teams.length<2?'disabled title="Нужно минимум 2 команды"':''}>${iconSvg('shuffle')} Сгенерировать расписание</button>
        <button class="btn btn-gold btn-sm" onclick="openMatchModal()" ${div.teams.length<2?'disabled title="Нужно минимум 2 команды"':''}>+ Добавить матч</button>
      </div>
    </div>
    <div id="fixtures-list"></div>
  `;
  const list = document.getElementById('fixtures-list');
  if(!div.matches.length){
    list.innerHTML = `<div class="empty-state"><h2>Матчей пока нет</h2><div>Создайте матч вручную или сгенерируйте календарь соревнования.</div></div>`;
    return;
  }
  const rounds = {};
  div.matches.forEach(m => {
    const key = m.round || 'Без тура';
    (rounds[key] = rounds[key] || []).push(m);
  });
  list.innerHTML = Object.keys(rounds).map(roundKey => `
    <div class="round-group">
      <div class="round-label">${escapeHtml(roundKey)}</div>
      ${rounds[roundKey].map(m => matchRowHtml(div, m)).join('')}
    </div>
  `).join('');
}
function matchRowHtml(div, m){
  const home = getTeam(div, m.homeId), away = getTeam(div, m.awayId);
  if(!home || !away) return '';
  return `
    <div class="match-row">
      <div class="match-team home clickable" onclick="openClub('${home.id}')">${escapeHtml(home.name)} ${crestHtml(home,'sm')}</div>
      <div class="score-box ${m.played?'':'unplayed'}" style="cursor:pointer" onclick="openScoreModal('${m.id}')">
        ${m.played ? `${m.homeScore}<span class="vs">:</span>${m.awayScore}` : 'Ввести счёт'}
      </div>
      <div class="match-team away clickable" onclick="openClub('${away.id}')">${crestHtml(away,'sm')} ${escapeHtml(away.name)}</div>
      <div class="match-date">${m.date ? formatDate(m.date) : '—'} ${m.played?'':''}</div>
      <div class="match-actions">
        <div class="icon-btn" title="Изменить счёт" onclick="openScoreModal('${m.id}')">${iconSvg('edit')}</div>
        <div class="icon-btn danger" title="Удалить матч" onclick="deleteMatch('${m.id}')">${iconSvg('trash')}</div>
      </div>
    </div>
  `;
}
function formatDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length!==3) return d;
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

/* ---------- teams panel ---------- */

      <button class="btn btn-gold btn-sm" onclick="generateSchedule()" ${div.teams.length<2?'disabled title="Нужно минимум 2 команды"':''}>${iconSvg('shuffle')} Сгенерировать туры</button>
    </div>
    <div class="teams-grid">
      ${div.teams.map(t => {
        const s = stats[t.id] || {mp:0,pts:0,position:'—'};
        return `
        <div class="team-card">

            <div class="icon-btn" title="Редактировать" onclick="openTeamModal('${t.id}')">${iconSvg('edit')}</div>

          <div class="clickable" onclick="openClub('${t.id}')">
            ${crestHtml(t,'lg')}
            <div style="min-width:0;flex:1"><div class="tname">${escapeHtml(t.name)}</div><div style="font-size:9.5px;color:var(--muted);margin-top:4px">${t.city?escapeHtml(t.city):'Футбольный клуб'}</div></div>
            <span class="club-card-link">Профиль →</span>
          </div>
          <div class="club-card-meta">
            <div class="club-card-stat"><strong>${s.position}</strong><span>Место</span></div>
            <div class="club-card-stat"><strong>${s.mp}</strong><span>Матчи</span></div>
            <div class="club-card-stat"><strong>${s.pts}</strong><span>Очки</span></div>
          </div>
          <div class="tstats">${t.stadium ? escapeHtml(t.stadium) : 'Стадион не указан'}${t.trophies && t.trophies.champion ? ' · '+t.trophies.champion+'× чемпион' : ''}</div>
        </div>`;
      }).join('')}
      <div class="add-team-card" onclick="openTeamModal()">
        <div class="plus">+</div><div>Добавить команду</div>
      </div>
    </div>`;
}

/* ---------- history panel ---------- */
function renderHistoryPanel(div){
  const el = document.getElementById('panel-history');

/* ================= SEASONS: ARCHIVE + END SEASON ================= */
function incrementSeasonLabel(label){
  const m = /^(\d{4})\s*\/\s*(\d{2,4})$/.exec(label||'');
  if(m){
    const y1 = parseInt(m[1]) + 1;
    const y2short = String((y1+1)).slice(-2);
    return `${y1}/${y2short}`;
  }
  const y = /^(\d{4})$/.exec(label||'');
  if(y) return String(parseInt(y[1])+1);
  return label ? label + ' (2)' : '';
}

function endSeason(){
  const div = activeDivision();
  if(!div.teams.length){ toast('В дивизионе нет команд'); return; }
  const unplayed = div.matches.filter(m => !m.played).length;
  let confirmMsg = `Завершить сезон ${div.seasonLabel}? Текущая таблица будет сохранена в архив, начнётся новый сезон с чистого листа.`;
  if(unplayed > 0) confirmMsg = `Внимание: ${unplayed} матч(ей) ещё не сыграны — они будут удалены без результата.\n\n` + confirmMsg;
  if(!confirm(confirmMsg)) return;

  const rows = computeStandings(div);
  const snapshot = rows.map(r => ({
    teamId: r.team.id, name: r.team.name, mp:r.mp, w:r.w, d:r.d, l:r.l, gf:r.gf, ga:r.ga, gd:r.gd, pts:r.pts
  }));
  div.archive.push({ label: div.seasonLabel, standings: snapshot });

  // Champion trophy
  if(rows.length){
    const champTeam = rows[0].team;
    champTeam.trophies = champTeam.trophies || { champion: 0 };
    champTeam.trophies.champion = (champTeam.trophies.champion || 0) + 1;
  }

  // Promotion / relegation between neighbouring divisions in sidebar order
  const idx = state.divisions.findIndex(d => d.id === div.id);
  let moveNote = '';
  const promoteN = div.promote || 0, relegateN = div.relegate || 0;
  if(promoteN > 0 && idx > 0){
    const upperDiv = state.divisions[idx-1];
    const promotedIds = rows.slice(0, promoteN).map(r => r.team.id);
    const promotedTeams = div.teams.filter(t => promotedIds.includes(t.id));
    div.teams = div.teams.filter(t => !promotedIds.includes(t.id));
    promotedTeams.forEach(t => upperDiv.teams.push(t));
    if(promotedTeams.length) moveNote += ` ↑ ${promotedTeams.length} команд(ы) повышены в «${upperDiv.name}».`;
  }
  if(relegateN > 0 && idx < state.divisions.length - 1 && idx >= 0){
    const lowerDiv = state.divisions[idx+1];
    const relegatedIds = rows.slice(Math.max(0,rows.length-relegateN)).map(r => r.team.id);
    const relegatedTeams = div.teams.filter(t => relegatedIds.includes(t.id));
    div.teams = div.teams.filter(t => !relegatedIds.includes(t.id));
    relegatedTeams.forEach(t => lowerDiv.teams.push(t));
    if(relegatedTeams.length) moveNote += ` ↓ ${relegatedTeams.length} команд(ы) вылетели в «${lowerDiv.name}».`;
  }

  div.matches = [];
  div.seasonLabel = incrementSeasonLabel(div.seasonLabel);
  state.activeTab = 'standings';
  state.clubView = null;
  renderAll();
  toast(`Сезон завершён и сохранён в архив. Новый: Season ${div.seasonLabel}.${moveNote}`);
}

/* ================= SCHEDULE GENERATION (жеребьёвка) ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Круговой метод (circle method): каждая команда играет с каждой ровно один раз.
// При нечётном числе команд добавляется «пустой» слот (пропуск тура).
function roundRobinPairs(teamIds){
  let ids = shuffle(teamIds); // случайная жеребьёвка порядка команд
  const hasBye = ids.length % 2 !== 0;
  if(hasBye) ids.push(null);
  const n = ids.length;
  const totalRounds = n - 1;
  const rounds = [];
  for(let r = 0; r < totalRounds; r++){
    const pairs = [];
    for(let i = 0; i < n / 2; i++){
      const a = ids[i], b = ids[n - 1 - i];
      if(a !== null && b !== null) pairs.push([a, b]);
    }
    rounds.push(pairs);
    // ротация: первая команда зафиксирована, остальные сдвигаются по кругу
    const fixed = ids[0];
    const rest = ids.slice(1);
    rest.unshift(rest.pop());
    ids = [fixed, ...rest];
  }
  return rounds;
}
function generateSchedule(){
  const div = activeDivision();
  if(div.teams.length < 2){ toast('Добавьте минимум 2 команды'); return; }
  const hasExisting = div.matches.length > 0;
  const msg = hasExisting
    ? 'Это удалит текущее расписание и все результаты матчей, и создаст новую жеребьёвку. Продолжить?'
    : `Сгенерировать расписание: каждая команда сыграет с каждой ровно один раз (всего команд: ${div.teams.length}). Продолжить?`;
  if(!confirm(msg)) return;

  const teamIds = div.teams.map(t => t.id);
  const rounds = roundRobinPairs(teamIds);
  const newMatches = [];
  rounds.forEach((pairs, idx) => {
    const shuffledPairs = shuffle(pairs); // случайный порядок матчей внутри тура
    shuffledPairs.forEach(pair => {
      let [homeId, awayId] = pair;
      if(Math.random() < 0.5) [homeId, awayId] = [awayId, homeId]; // случайно кто хозяин поля
      newMatches.push({
        id: uid(), homeId, awayId,
        date: '', round: `Тур ${idx + 1}`,
        played: false, homeScore: 0, awayScore: 0
      });
    });
  });
  div.matches = newMatches;
  state.activeTab = 'fixtures';
  renderAll();
  toast(`Расписание создано: ${rounds.length} туров, ${newMatches.length} матчей`);
}

  if(!confirm(`Удалить команду «${t.name}»? Все её матчи также будут удалены.`)) return;
  div.teams = div.teams.filter(x => x.id !== teamId);
  div.matches = div.matches.filter(m => m.homeId !== teamId && m.awayId !== teamId);
  renderAll();
  toast('Команда удалена');
}

/* ---- match modal ---- */
function openMatchModal(){
  const div = activeDivision();
  const homeSel = document.getElementById('match-home');
  const awaySel = document.getElementById('match-away');
  homeSel.innerHTML = div.teams.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
  awaySel.innerHTML = div.teams.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
  if(div.teams.length > 1) awaySel.selectedIndex = 1;
  document.getElementById('match-date').value = new Date().toISOString().slice(0,10);
  const roundNums = div.matches.map(m => parseInt((m.round||'').replace(/\D/g,''))||0);
  const nextRound = roundNums.length ? Math.max(...roundNums) : 0;
  document.getElementById('match-round').value = `Тур ${nextRound+1}`;
  openModal('overlay-match');
}
function submitMatch(){
  const div = activeDivision();
  const homeId = document.getElementById('match-home').value;
  const awayId = document.getElementById('match-away').value;
  if(homeId === awayId){ toast('Команды должны различаться'); return; }
  div.matches.push({
    id: uid(), homeId, awayId,
    date: document.getElementById('match-date').value,
    round: document.getElementById('match-round').value.trim(),
    played: false, homeScore: 0, awayScore: 0
  });
  closeModal('overlay-match');
  renderAll();
  toast('Матч добавлен в расписание');
}
function deleteMatch(matchId){
  const div = activeDivision();
  if(!confirm('Удалить этот матч?')) return;
  div.matches = div.matches.filter(m => m.id !== matchId);
  renderAll();
  toast('Матч удалён');
}

/* ---- score modal ---- */
function openScoreModal(matchId){
  const div = activeDivision();
  const m = div.matches.find(x => x.id === matchId);
  const home = getTeam(div, m.homeId), away = getTeam(div, m.awayId);
  document.getElementById('score-match-id').value = matchId;
  document.getElementById('score-home-name').innerText = home.name;
  document.getElementById('score-away-name').innerText = away.name;
  document.getElementById('score-home-val').value = m.played ? m.homeScore : 0;
  document.getElementById('score-away-val').value = m.played ? m.awayScore : 0;
  openModal('overlay-score');
}
function submitScore(){
  const div = activeDivision();
  const matchId = document.getElementById('score-match-id').value;
  const m = div.matches.find(x => x.id === matchId);
  const hs = parseInt(document.getElementById('score-home-val').value);
  const as = parseInt(document.getElementById('score-away-val').value);
  if(isNaN(hs) || isNaN(as) || hs < 0 || as < 0){ toast('Введите корректный счёт'); return; }
  m.homeScore = hs; m.awayScore = as; m.played = true;
  closeModal('overlay-score');
  renderAll();
  toast('Таблица обновлена автоматически');
}

/* ================= EXPORT: STANDINGS AS HIGH-RES JPEG ================= */
async function exportStandingsImage(){
  const div = activeDivision();
  if(!div || !div.teams.length){ toast('Нет данных для экспорта'); return; }
  if(typeof html2canvas === 'undefined'){
    toast('Модуль экспорта не загрузился — проверьте интернет-соединение');
    return;
  }

  toast('Готовим изображение…');

  const rows = computeStandings(div);
  const promoteN = div.promote || 0;
  const relegateN = div.relegate || 0;
  const canOverlap = promoteN + relegateN > rows.length;
  const dateStr = new Date().toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric' });

  const cols = [
    ['#','POS'],['КЛУБ','КЛУБ'],['И','И'],['В','В'],['Н','Н'],['П','П'],['ЗМ','ЗМ'],['ПМ','ПМ'],['РМ','РМ'],['О','О']
  ];

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-99999px;top:0;width:920px;background:#ffffff;font-family:Inter,sans-serif;';
  wrap.innerHTML = `
    <div style="padding:32px 36px 26px;background:linear-gradient(120deg,#2a153d,#4a2368 72%,#623286);color:#fff;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:38px;height:38px;border-radius:10px;background:#fff;color:#432160;display:flex;align-items:center;justify-content:center;font-family:Manrope,sans-serif;font-weight:800;font-size:17px;">A</div>
        <div style="font-family:Manrope,sans-serif;font-size:17px;font-weight:800;letter-spacing:.5px;">ARENA</div>
      </div>
      <div style="font-family:Manrope,sans-serif;font-size:32px;font-weight:800;letter-spacing:-.6px;">${escapeHtml(div.name)}</div>
      <div style="font-size:13px;opacity:.75;margin-top:6px;">Season ${escapeHtml(div.seasonLabel||'')} · Турнирная таблица · ${dateStr}</div>
    </div>
    <div style="padding:26px 36px 30px;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <thead>
          <tr>
            ${cols.map((c,i)=>`<th style="text-align:${i<2?'left':'center'};padding:12px 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#8d8995;border-bottom:2px solid #17131f;">${c[1]}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows.map((r,i) => {
            const isPromote = !canOverlap && i < promoteN;
            const isRelegate = !canOverlap && i >= rows.length - relegateN;
            const stripe = isPromote ? '#5b2d82' : (isRelegate ? '#d92d20' : 'transparent');
            const crest = r.team.logo
              ? `<img src="${r.team.logo}" style="width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid #e6e4ea;vertical-align:middle;margin-right:10px;">`
              : `<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:#eee7f5;color:#432160;font-size:10px;font-weight:800;vertical-align:middle;margin-right:10px;">${initials(r.team.name)}</span>`;
            const gdColor = r.gd>0?'#16845c':r.gd<0?'#c94338':'#625e69';
            return `
            <tr style="border-left:4px solid ${stripe};">
              <td style="padding:12px 8px 12px 12px;border-bottom:1px solid #eeecf0;font-weight:800;color:#17131f;">${i+1}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;font-weight:700;color:#17131f;white-space:nowrap;">${crest}${escapeHtml(r.team.name)}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:#625e69;">${r.mp}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:#625e69;">${r.w}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:#625e69;">${r.d}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:#625e69;">${r.l}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:#625e69;">${r.gf}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:#625e69;">${r.ga}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;color:${gdColor};font-weight:700;">${r.gd>0?'+':''}${r.gd}</td>
              <td style="padding:12px 8px;border-bottom:1px solid #eeecf0;text-align:center;font-weight:800;color:#17131f;">${r.pts}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div style="display:flex;gap:22px;margin-top:18px;font-size:11px;color:#777483;">
        ${promoteN ? `<span><span style="display:inline-block;width:10px;height:10px;background:#5b2d82;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>Зона повышения</span>` : ''}
        ${relegateN ? `<span><span style="display:inline-block;width:10px;height:10px;background:#d92d20;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>Зона вылета</span>` : ''}
      </div>
      <div style="margin-top:22px;padding-top:14px;border-top:1px solid #eeecf0;font-size:10px;color:#9a97a5;">Сформировано в ARENA · ${dateStr}</div>
    </div>
  `;
  document.body.appendChild(wrap);

  try{
    // Ждём загрузки всех логотипов (base64 — обычно мгновенно, но на всякий случай)
    const imgs = wrap.querySelectorAll('img');
    await Promise.all(Array.from(imgs).map(img => img.complete ? Promise.resolve() :
      new Promise(res => { img.onload = res; img.onerror = res; })));

    const canvas = await html2canvas(wrap, {
      scale: 3,              // высокое разрешение — картинка не размывается на любом экране
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false
    });
    const dataUrl = canvas.toDataURL('image/jpeg', 0.98); // максимальное качество JPEG
    const safeName = `${div.name}-${div.seasonLabel||''}`.replace(/[^\wа-яА-ЯёЁ\-]+/g,'_');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `${safeName}-standings.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Таблица сохранена в JPEG');
  } catch(err){
    console.error('Export error:', err);
    toast('Не удалось экспортировать изображение');
  } finally {
    wrap.remove();
  }
}

/* ================= FIREBASE SYNC ================= */
const FB_PATH = 'arena/state'; // весь стейт приложения хранится одним узлом в Realtime Database

// Ждём, пока модульный <script type="module"> в <head> проинициализирует Firebase
// и положит { db, ref, set, get, onValue } в window.__fb.
function waitForFirebase(){
  return new Promise(resolve => {
    if(window.__fb) return resolve(window.__fb);
    window.addEventListener('firebase-ready', () => resolve(window.__fb), { once:true });
  });
}

// Firebase Realtime Database не хранит пустые массивы/объекты и может отдавать
// разреженные массивы как объекты с числовыми ключами — нормализуем данные при загрузке.
function toArray(v){
  if(Array.isArray(v)) return v;
  if(v && typeof v === 'object') return Object.values(v);
  return [];
}
function normalizeState(raw){
  const divisions = toArray(raw.divisions).map(d => {
    const teams = toArray(d.teams).map(t => ({
      players: [],
      trophies: { champion: 0 },
      ...t,
      players: toArray(t.players)
    }));
    return {
      promote: 2, relegate: 2, seasonLabel: '2026/27',
      ...d,
      teams,
      matches: toArray(d.matches),
      archive: toArray(d.archive)
    };
  });
  return {
    divisions,
    activeDivisionId: raw.activeDivisionId || (divisions[0] ? divisions[0].id : null),
    activeTab: raw.activeTab || 'standings',
    clubView: raw.clubView || null
  };
}

let __applyingRemote = false; // true пока применяем данные, только что пришедшие от Firebase
let __saveTimer = null;

function saveStateToFirebase(){
  if(!window.__fb) return;
  const { db, ref, set } = window.__fb;
  set(ref(db, FB_PATH), state).catch(err => {
    console.error('Firebase: ошибка сохранения', err);
    toast('Не удалось сохранить изменения в Firebase');
  });
}
// Дебаунс: быстрые последовательные изменения (например, серия кликов) шлют одну запись
function scheduleSave(){
  if(__applyingRemote) return; // не сохраняем то, что только что пришло с сервера — иначе будет петля
  if(!window.__fb) return;
  clearTimeout(__saveTimer);
  __saveTimer = setTimeout(saveStateToFirebase, 500);
}

async function initApp(){
  const fb = await waitForFirebase();
  const { db, ref, get, onValue } = fb;

  try{
    const snap = await get(ref(db, FB_PATH));
    if(snap.exists() && snap.val() && toArray(snap.val().divisions).length){
      state = normalizeState(snap.val());
      toast('Данные загружены из Firebase');
    } else {
      seed();
      saveStateToFirebase(); // первый запуск — записываем стартовые данные в базу
      toast('Firebase подключён, создана стартовая лига');
    }
  } catch(err){
    console.error('Firebase: ошибка загрузки', err);
    seed();
    toast('Firebase недоступен — работаем локально');
  }

  renderAll();

  // Живая синхронизация: изменения из другой вкладки/устройства подтягиваются сюда сами
  onValue(ref(db, FB_PATH), (snap) => {
    if(!snap.exists()) return;
    const remote = normalizeState(snap.val());
    __applyingRemote = true;
    // сохраняем текущий контекст навигации, если он всё ещё актуален после обновления
    const keepDivisionId = state.activeDivisionId;
    const keepTab = state.activeTab;
    const keepClubView = state.clubView;
    state = remote;
    if(state.divisions.some(d => d.id === keepDivisionId)) state.activeDivisionId = keepDivisionId;
    state.activeTab = keepTab;
    state.clubView = keepClubView;
    renderAllUI();
    __applyingRemote = false;
  });
}

/* ================= INIT ================= */
initApp();
</script>
